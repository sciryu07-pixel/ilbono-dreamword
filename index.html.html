<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>꿈 단어장</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#F3F4F1;
    --surface:#FFFFFF;
    --surface-2:#ECEDE9;
    --ink:#1E2430;
    --ink-soft:#5B6472;
    --stamp:#B23A2E;
    --stamp-ghost:#B23A2E1A;
    --pen:#2E5C8A;
    --pen-ghost:#2E5C8A14;
    --line:#DDE1DE;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171C;
      --surface:#1C2029;
      --surface-2:#232833;
      --ink:#E9EAEA;
      --ink-soft:#9AA3AE;
      --stamp:#E2695A;
      --stamp-ghost:#E2695A26;
      --pen:#7FB0E0;
      --pen-ghost:#7FB0E026;
      --line:#2B303A;
      color-scheme:dark;
    }
  }

  *{box-sizing:border-box;}
  html,body{ margin:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans KR","Noto Sans JP",sans-serif;
    padding-inline:16px;
    padding-block:0 28px;
    max-width:640px;
    margin-inline:auto;
  }
  ::selection{ background:var(--pen-ghost); }

  h1,h2,h3{ text-wrap:balance; margin:0; }

  .top{
    position:sticky;
    top:0;
    background:var(--bg);
    padding-block:14px 10px;
    z-index:5;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-size:11.5px;
    letter-spacing:.08em;
    color:var(--ink-soft);
    font-family:"Noto Sans JP","Noto Sans KR",sans-serif;
  }
  h1{
    font-family:"Noto Serif KR","Noto Sans KR",serif;
    font-size:24px;
    font-weight:700;
    margin-top:2px;
    letter-spacing:-.01em;
  }
  .lede{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:4px;
    line-height:1.5;
  }
  .lede b{ color:var(--ink); font-weight:600; }

  .searchwrap{
    margin-top:12px;
    position:relative;
  }
  input[type="search"]{
    width:100%;
    appearance:none;
    border:1.5px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    border-radius:10px;
    padding:10px 36px 10px 14px;
    font-size:15px;
    font-family:inherit;
  }
  input[type="search"]:focus{
    outline:none;
    border-color:var(--pen);
    box-shadow:0 0 0 3px var(--pen-ghost);
  }
  .searchwrap::after{
    content:"検索";
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    font-size:10.5px;
    color:var(--ink-soft);
    pointer-events:none;
  }

  .jump{
    display:flex;
    gap:6px;
    overflow-x:auto;
    margin-top:10px;
    padding-bottom:2px;
    scrollbar-width:none;
  }
  .jump::-webkit-scrollbar{ display:none; }
  .jump button{
    flex:none;
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    background:var(--surface-2);
    border:none;
    border-radius:7px;
    padding:5px 10px;
    cursor:pointer;
  }
  .jump button:hover{ color:var(--ink); }
  .jump button:focus-visible{ outline:2px solid var(--pen); outline-offset:1px; }

  .count{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:10px;
  }

  .group{ margin-top:18px; }
  .group-tab{
    display:inline-flex;
    align-items:baseline;
    gap:6px;
    background:var(--ink);
    color:var(--bg);
    border-radius:6px 6px 0 0;
    padding:3px 10px 4px;
    font-family:"Noto Serif KR",serif;
    font-weight:700;
    font-size:14px;
  }
  .group-tab span{
    font-family:"Noto Sans KR",sans-serif;
    font-weight:400;
    font-size:10.5px;
    opacity:.7;
  }
  .rows{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:0 10px 10px 10px;
    overflow:hidden;
  }

  .row{
    display:grid;
    grid-template-columns:34% 1fr;
    gap:10px;
    align-items:center;
    padding:10px 12px;
    border-top:1px solid var(--line);
    cursor:pointer;
    background:var(--surface);
  }
  .group .rows .row:first-child{ border-top:none; }
  .row:hover{ background:var(--surface-2); }
  .row:focus-visible{ outline:2px solid var(--pen); outline-offset:-2px; }

  .kr{
    font-weight:700;
    font-size:14.5px;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .stamp{
    flex:none;
    width:16px; height:16px;
    border:1.4px solid var(--stamp);
    border-radius:3px;
    color:var(--stamp);
    font-size:9px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:"Noto Serif KR",serif;
    transform:rotate(-4deg);
  }
  .jp-line{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .jp-line .jp-text{ flex:1; min-width:0; }
  .jp{
    font-size:15px;
    font-family:"Noto Sans JP","Noto Sans KR",sans-serif;
  }
  .kanji{
    color:var(--ink-soft);
    font-size:11.5px;
    margin-left:5px;
  }

  .speak-btn{
    flex:none;
    width:26px; height:26px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--pen-ghost);
    color:var(--pen);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .speak-btn svg{ width:13px; height:13px; }
  .speak-btn:hover{ background:var(--pen); color:var(--surface); }
  .speak-btn:active{ transform:scale(.92); }
  .speak-btn.playing{ background:var(--pen); color:var(--surface); }
  .speak-btn[disabled]{ opacity:.35; cursor:default; }
  .speak-btn[disabled]:hover{ background:var(--pen-ghost); color:var(--pen); }

  .no-tts{
    margin-top:8px;
    font-size:11.5px;
    color:var(--ink-soft);
  }

  .practice{
    grid-column:1 / -1;
    display:none;
    margin-top:8px;
    padding-top:10px;
    border-top:1px dashed var(--line);
  }
  .row.open .practice{ display:block; }
  .practice .sentence{
    font-family:"Noto Sans JP","Noto Sans KR",sans-serif;
    font-size:16px;
    line-height:1.7;
  }
  .practice .sentence .fill{
    color:var(--pen);
    font-weight:700;
  }
  .practice .kr-line{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .practice .copybtn{
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    color:var(--pen);
    background:var(--pen-ghost);
    border:none;
    border-radius:7px;
    padding:6px 11px;
    cursor:pointer;
  }
  .practice .copybtn:active{ transform:translateY(1px); }
  .practice .actions{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
  }
  .practice .actions .speak-btn{ margin-top:0; }

  .empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:13.5px;
    padding:36px 0;
  }

  .tip{
    margin-top:22px;
    background:var(--surface);
    border:1px solid var(--line);
    border-left:3px solid var(--stamp);
    border-radius:8px;
    padding:12px 14px;
    font-size:12.5px;
    line-height:1.6;
    color:var(--ink-soft);
  }
  .tip b{ color:var(--ink); }
  .tip .jpline{
    font-family:"Noto Sans JP","Noto Sans KR",sans-serif;
    color:var(--ink);
  }

  .printbtn{
    display:none;
  }
  @media print{
    .searchwrap, .jump, .speak-btn, .practice, .no-tts, .printbtn{ display:none !important; }
    .top{ position:static; border-bottom:none; }
    body{ max-width:none; }
  }

  footer{
    margin-top:20px;
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    padding-bottom:10px;
  }
</style>
</head>
<body>

<div class="top">
  <div class="eyebrow">職業（しょくぎょう）の　ことば</div>
  <h1>꿈 단어장</h1>
  <p class="lede"><b>ゆめは　なんですか。</b>에 대한 대답으로 쓸 수 있는 직업 이름을 가나다순으로 모았어요. <span class="stamp" style="display:inline-flex; vertical-align:-2px;">印</span> 표시는 교과서에 나온 단어예요.</p>
  <div class="searchwrap">
    <input type="search" id="search" placeholder="한국어나 일본어로 검색해 보세요 (예: 의사, かしゅ)" autocomplete="off">
  </div>
  <div class="jump" id="jump"></div>
</div>

<div class="count" id="count"></div>
<div id="list"></div>
<div class="empty" id="empty" hidden>검색 결과가 없어요. 다른 낱말로 찾아보세요.</div>

<div class="tip">
  <b>더 찾아보기 —</b> 스포츠 이름 뒤에 <b>せんしゅ(선수)</b>를 붙이면 다른 종목도 만들 수 있어요.<br>
  <span class="jpline">たっきゅうせんしゅ</span>(탁구선수) · <span class="jpline">すいえいせんしゅ</span>(수영선수)
</div>

<footer>낱말을 누르면 문장으로 연습할 수 있어요 · 2학년 회화 수업</footer>

<script>
const DATA = [
  ["ㄱ","가수","かしゅ","歌手",true],
  ["ㄱ","간호사","かんごし","看護師",false],
  ["ㄱ","건축가","けんちくか","建築家",false],
  ["ㄱ","경찰관","けいさつかん","警察官",false],
  ["ㄱ","공무원","こうむいん","公務員",false],
  ["ㄱ","교사","きょうし","教師",false],
  ["ㄱ","구급대원","きゅうきゅうたいいん","救急隊員",false],
  ["ㄱ","군인","ぐんじん","軍人",false],
  ["ㄱ","기자","きしゃ","記者",false],
  ["ㄴ","농구선수","バスケットボールせんしゅ","",false],
  ["ㄷ","디자이너","デザイナー","",false],
  ["ㅁ","만화가","まんがか","漫画家",false],
  ["ㅁ","메이크업 아티스트","メイクアップアーティスト","",false],
  ["ㅁ","미용사","びようし","美容師",false],
  ["ㅂ","배우","はいゆう","俳優",false],
  ["ㅂ","변호사","べんごし","弁護士",false],
  ["ㅂ","보육교사","ほいくし","保育士",false],
  ["ㅅ","사업가","じつぎょうか","実業家",false],
  ["ㅅ","사진작가","しゃしんか","写真家",false],
  ["ㅅ","상담사","カウンセラー","",false],
  ["ㅅ","성우","せいゆう","声優",false],
  ["ㅅ","소방관","しょうぼうし","消防士",false],
  ["ㅅ","소설가","しょうせつか","小説家",false],
  ["ㅅ","수의사","じゅういし","獣医師",false],
  ["ㅅ","승무원","キャビンアテンダント","",false],
  ["ㅇ","아나운서","アナウンサー","",true],
  ["ㅇ","야구선수","やきゅうせんしゅ","",false],
  ["ㅇ","약사","やくざいし","薬剤師",false],
  ["ㅇ","연예인","げいのうじん","芸能人",false],
  ["ㅇ","요리사","シェフ","料理人",false],
  ["ㅇ","운동선수","スポーツせんしゅ","",false],
  ["ㅇ","웹툰작가","ウェブトゥーンさっか","ウェブトゥーン作家",false],
  ["ㅇ","유튜버","ユーチューバー","",false],
  ["ㅇ","의사","いしゃ","",true],
  ["ㅈ","작곡가","さっきょくか","作曲家",false],
  ["ㅊ","축구선수","サッカーせんしゅ","",true],
  ["ㅌ","통역사","つうやくし","通訳士",false],
  ["ㅍ","파일럿","パイロット","",false],
  ["ㅍ","파티시에","パティシエ","",true],
  ["ㅍ","판사","さいばんかん","裁判官",false],
  ["ㅍ","프로게이머","プロゲーマー","",false],
  ["ㅍ","프로그래머","プログラマー","",false],
  ["ㅎ","화가","がか","画家",false],
  ["ㅎ","회사원","かいしゃいん","会社員",false],
];

const listEl = document.getElementById('list');
const jumpEl = document.getElementById('jump');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');
const searchEl = document.getElementById('search');
const topEl = document.querySelector('.top');

const groups = [...new Set(DATA.map(d => d[0]))];

const TTS_SUPPORTED = 'speechSynthesis' in window;
if(!TTS_SUPPORTED){
  const note = document.createElement('p');
  note.className = 'no-tts';
  note.textContent = '이 브라우저에서는 발음 듣기가 지원되지 않아요. 최신 크롬이나 사파리로 열어 보세요.';
  topEl.appendChild(note);
}
if(TTS_SUPPORTED && speechSynthesis.getVoices().length === 0){
  speechSynthesis.addEventListener('voiceschanged', () => {}, {once:true});
}

function pickJapaneseVoice(){
  const voices = speechSynthesis.getVoices();
  return voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ja')) || null;
}

let activeBtn = null;
function speak(text, btn){
  if(!TTS_SUPPORTED) return;
  speechSynthesis.cancel();
  if(activeBtn) activeBtn.classList.remove('playing');
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ja-JP';
  utter.rate = 0.82;
  const voice = pickJapaneseVoice();
  if(voice) utter.voice = voice;
  if(btn){
    activeBtn = btn;
    btn.classList.add('playing');
    utter.onend = utter.onerror = () => btn.classList.remove('playing');
  }
  speechSynthesis.speak(utter);
}

jumpEl.innerHTML = groups.map(g => `<button type="button" data-jump="${g}">${g}</button>`).join('');
jumpEl.addEventListener('click', e => {
  const btn = e.target.closest('button[data-jump]');
  if(!btn) return;
  const target = document.getElementById('group-' + btn.dataset.jump);
  if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
});

function render(filter){
  const q = (filter || '').trim().toLowerCase();
  let shown = 0;
  let html = '';
  for(const g of groups){
    const items = DATA.filter(d => d[0] === g && matches(d, q));
    if(items.length === 0) continue;
    shown += items.length;
    html += `<div class="group" id="group-${g}">
      <div class="group-tab">${g} <span>${items.length}개</span></div>
      <div class="rows">
        ${items.map(rowHtml).join('')}
      </div>
    </div>`;
  }
  listEl.innerHTML = html;
  listEl.querySelectorAll('.row').forEach(row => {
    row.addEventListener('click', () => row.classList.toggle('open'));
    row.querySelectorAll('.speak-btn').forEach(btn => {
      if(!TTS_SUPPORTED){ btn.disabled = true; return; }
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        speak(e.currentTarget.dataset.speak, e.currentTarget);
      });
    });
    row.querySelector('.copybtn')?.addEventListener('click', async (e) => {
      e.stopPropagation();
      const text = e.currentTarget.dataset.copy;
      try{
        await navigator.clipboard.writeText(text);
        const orig = e.currentTarget.textContent;
        e.currentTarget.textContent = '복사됨 ✓';
        setTimeout(() => { e.currentTarget.textContent = orig; }, 1200);
      }catch(err){
        const range = document.createRange();
        range.selectNodeContents(e.currentTarget.previousElementSibling || e.currentTarget);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
    });
  });
  countEl.textContent = q ? `${shown}개 찾음` : `총 ${DATA.length}개 직업`;
  emptyEl.hidden = shown !== 0;
}

function matches(d, q){
  if(!q) return true;
  const [,kr,jp,kanji] = d;
  return kr.toLowerCase().includes(q) || jp.toLowerCase().includes(q) || (kanji||'').includes(q);
}

function rowHtml(d){
  const [,kr,jp,kanji,given] = d;
  const spoken = jp.split(' / ')[0].split('／')[0];
  const sentence = `わたしの ゆめは ${spoken} です。`;
  return `<div class="row" tabindex="0">
    <div class="kr">${given ? '<span class="stamp">印</span>' : ''}${escapeHtml(kr)}</div>
    <div>
      <div class="jp-line">
        <span class="jp-text"><span class="jp">${escapeHtml(jp)}</span>${kanji ? `<span class="kanji">(${escapeHtml(kanji)})</span>` : ''}</span>
        ${speakBtnHtml(spoken, '단어 발음 듣기')}
      </div>
      <div class="practice">
        <div class="sentence">わたしの　ゆめは　<span class="fill">${escapeHtml(spoken)}</span>　です。</div>
        <div class="kr-line">제 꿈은 ${escapeHtml(kr)}입니다.</div>
        <div class="actions">
          <button type="button" class="copybtn" data-copy="${escapeHtml(sentence)}">문장 복사</button>
          ${speakBtnHtml(sentence, '문장 발음 듣기')}
        </div>
      </div>
    </div>
  </div>`;
}

const SPEAKER_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3,9 8,9 13,4 13,20 8,15 3,15" fill="currentColor" stroke="none"/><path d="M16 8a5 5 0 0 1 0 8"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;

function speakBtnHtml(text, label){
  return `<button type="button" class="speak-btn" data-speak="${escapeHtml(text)}" aria-label="${label}" title="${label}">${SPEAKER_SVG}</button>`;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

searchEl.addEventListener('input', () => render(searchEl.value));
render('');
</script>

</body>
</html>
